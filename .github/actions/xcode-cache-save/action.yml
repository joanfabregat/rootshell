name: Xcode cache save
description: >-
  Save the caches that xcode-setup restored, from runs on the default
  branch only. Every run saving its own copy outgrows the repository's
  10 GB cache quota within two runs and evicts caches still in use, so
  pull requests only read what the nightly run saved. A fork can set the
  repository variable CI_SAVE_CACHES_ON_PR to true, passed in as
  save-on-pr, to save from its own pull requests too.

inputs:
  spm-key:
    description: xcode-setup's spm-key output.
    required: true
  spm-hit:
    description: xcode-setup's spm-hit output.
    required: true
  save-on-pr:
    description: The repository variable CI_SAVE_CACHES_ON_PR; composite actions cannot read vars themselves.
    default: ''
  cas-key:
    description: xcode-setup's cas-key output.
    required: true

runs:
  using: composite
  steps:
    - name: Decide whether to save
      id: check
      shell: bash
      env:
        ON_DEFAULT_BRANCH: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
        SAVE_ON_PR: ${{ inputs.save-on-pr }}
      run: |
        if [ "$ON_DEFAULT_BRANCH" = true ] || [ "$SAVE_ON_PR" = true ]; then
          echo "save=true" >> "$GITHUB_OUTPUT"
        else
          echo "save=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Save Swift packages
      if: steps.check.outputs.save == 'true' && inputs.spm-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .build/SourcePackages
        key: ${{ inputs.spm-key }}

    - name: Save compilation results
      if: steps.check.outputs.save == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.CAS_PATH }}
        key: ${{ inputs.cas-key }}
