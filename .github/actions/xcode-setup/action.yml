name: Xcode setup
description: >-
  Restore the Swift package and compilation caches, enable Xcode's
  compilation cache for every later xcodebuild in the job, and resolve
  Swift packages.

inputs:
  cache:
    description: Compilation cache name, one per job.
    required: true
  scheme:
    description: Scheme to resolve packages for.
    required: true
  resolve-args:
    description: Extra options for package resolution.
    default: ''

runs:
  using: composite
  steps:
    - name: Cache Swift packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .build/SourcePackages
        key: spm-${{ runner.os }}-${{ hashFiles('rootshell.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
        restore-keys: spm-${{ runner.os }}-

    # The compilation cache is content-addressed, so entries from an older
    # checkout stay valid, but nothing prunes it. Starting a new cache each
    # ISO week, and with each Xcode build, bounds its size.
    - name: Enable compilation caching
      id: cas
      shell: bash
      run: |
        cas="$RUNNER_TEMP/CompilationCache.noindex"
        xcconfig="$RUNNER_TEMP/ci.xcconfig"
        printf 'COMPILATION_CACHE_ENABLE_CACHING = YES\nCOMPILATION_CACHE_CAS_PATH = %s\n' "$cas" > "$xcconfig"
        echo "XCODE_XCCONFIG_FILE=$xcconfig" >> "$GITHUB_ENV"
        echo "CAS_PATH=$cas" >> "$GITHUB_ENV"
        echo "path=$cas" >> "$GITHUB_OUTPUT"
        echo "prefix=cas-${{ inputs.cache }}-$(xcodebuild -version | tail -n 1 | awk '{print $NF}')-$(date -u +%G-%V)-" >> "$GITHUB_OUTPUT"

    - name: Cache compilation results
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.cas.outputs.path }}
        key: ${{ steps.cas.outputs.prefix }}${{ github.run_id }}
        restore-keys: ${{ steps.cas.outputs.prefix }}

    - name: Resolve Swift packages
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SCHEME: ${{ inputs.scheme }}
        RESOLVE_ARGS: ${{ inputs.resolve-args }}
      run: |
        # RESOLVE_ARGS holds space-separated words.
        # shellcheck disable=SC2086
        .github/scripts/resolve-packages.sh "$SCHEME" \
          -skipPackagePluginValidation -skipMacroValidation $RESOLVE_ARGS
