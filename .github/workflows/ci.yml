name: CI
'on':
  push:
    branches:
      - main
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  xcode:
    name: ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: App Store Release (iOS device)
            scheme: rootshell-AppStore
            platform: ios-device
            actions: build
            extra: -configuration ReleaseAppStore
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode || '26.6' }}.app/Contents/Developer
      PACKAGES_DIR: ${{ github.workspace }}/.build/SourcePackages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('rootshell.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved')
            }}
          restore-keys: spm-${{ runner.os }}-
      - name: Resolve Swift packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/resolve-packages.sh "${{ matrix.scheme }}" -clonedSourcePackagesDirPath
          "$PACKAGES_DIR" -skipPackagePluginValidation -skipMacroValidation
      - name: Resolve destination
        env:
          PLATFORM: ${{ matrix.platform }}
          SCHEME: ${{ matrix.scheme }}
          OS: ${{ matrix.os }}
        run: "simulator() {\n  xcodebuild -showdestinations -project rootshell.xcodeproj\
          \ -scheme \"$SCHEME\" \\\n    -clonedSourcePackagesDirPath \"$PACKAGES_DIR\"\
          \ -skipPackagePluginValidation -skipMacroValidation |\n    grep -F \"platform:$1\
          \ Simulator,\" | grep -F \"name:$2\" | grep -v 'Designed for' |\n    grep\
          \ -F \"OS:${OS}\" | sed -n 's/.* id:\\([^,]*\\),.*/\\1/p' | head -n 1\n\
          }\ncase \"$PLATFORM\" in\n  ios) udid=$(simulator iOS iPhone); destination=\"\
          id=$udid\" ;;\n  visionos) udid=$(simulator visionOS \"Apple Vision Pro\"\
          ); destination=\"id=$udid\" ;;\n  ios-device) udid=n/a; destination=\"generic/platform=iOS\"\
          \ ;;\n  visionos-device) udid=n/a; destination=\"generic/platform=visionOS\"\
          \ ;;\n  catalyst) udid=n/a; destination=\"platform=macOS,arch=arm64,variant=Mac\
          \ Catalyst\" ;;\n  macos) udid=n/a; destination=\"platform=macOS,arch=arm64\"\
          \ ;;\n  *) echo \"Unknown platform $PLATFORM\" >&2; exit 1 ;;\nesac\nif\
          \ [ -z \"$udid\" ]; then\n  echo \"xcodebuild lists no $PLATFORM simulator\
          \ for $SCHEME\" >&2\n  xcodebuild -showdestinations -project rootshell.xcodeproj\
          \ -scheme \"$SCHEME\" \\\n    -clonedSourcePackagesDirPath \"$PACKAGES_DIR\"\
          \ >&2 || true\n  exit 1\nfi\necho \"DESTINATION=$destination\" >> \"$GITHUB_ENV\"\
          \necho \"Destination: $destination\"\n"
      - name: xcodebuild ${{ matrix.actions }}
        env:
          SCHEME: ${{ matrix.scheme }}
          ACTIONS: ${{ matrix.actions }}
          EXTRA: ${{ matrix.extra }}
        run: "# ACTIONS and EXTRA hold space-separated words from the matrix.\n# shellcheck\
          \ disable=SC2086\nxcodebuild \\\n  -project rootshell.xcodeproj \\\n  -scheme\
          \ \"$SCHEME\" \\\n  -destination \"$DESTINATION\" \\\n  -clonedSourcePackagesDirPath\
          \ \"$PACKAGES_DIR\" \\\n  -disableAutomaticPackageResolution \\\n  -skipPackagePluginValidation\
          \ \\\n  -skipMacroValidation \\\n  -resultBundlePath \"$RUNNER_TEMP/result.xcresult\"\
          \ \\\n  -quiet \\\n  CODE_SIGNING_ALLOWED=NO \\\n  $EXTRA $ACTIONS\n"
      - name: Show test failures
        if: failure() && contains(matrix.actions, 'test')
        run: "xcrun xcresulttool get test-results summary --path \"$RUNNER_TEMP/result.xcresult\"\
          \ |\n  jq -r '.testFailures[]? | \"\\(.testIdentifierString // .testName):\
          \ \\(.failureText)\"'\n"
