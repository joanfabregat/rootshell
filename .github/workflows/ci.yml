name: CI

# Fast checks for every pull request. The slower Release, visionOS, Mac
# Catalyst and VPN host builds are in full-ci.yml.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      xcode: ${{ steps.filter.outputs.xcode }}
    steps:
      # A required check that is skipped counts as passed, so a pull request
      # that only touches documentation or script tests can merge without
      # the Xcode jobs. Markdown under Resources/ is bundled into the app.
      - name: Check whether the Xcode jobs are needed
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            echo "xcode=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          printf '%s\n' "$files"
          if printf '%s\n' "$files" |
            awk '!/^docs\// && !/^scripts\/tests\// && $0 != "LICENSE" && !(/\.md$/ && !/^Resources\//)' |
            grep -q .; then
            echo "xcode=true" >> "$GITHUB_OUTPUT"
          else
            echo "xcode=false" >> "$GITHUB_OUTPUT"
          fi

  xcode:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.xcode == 'true'
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Test entries also run the scheme's build action, so the
          # products under test are compiled too. rootshellTests is the
          # exception: it has no test host, and with "build test" xcodebuild
          # offers no iOS Simulator destination for it.
          - name: iOS tests and builds
            cache: ios-simulator
            platform: ios
            os: '27.0'
            resolve: rootshell-AppStore
            builds: |
              -scheme rootshellTests test
              -scheme rootshell-AppStore build
              -scheme rootshell-China build
          - name: Helper tests (macOS)
            cache: helper
            platform: macos
            resolve: rootshell-helper
            metal: 'false'
            builds: |
              -scheme rootshell-helper build test
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      PACKAGES_DIR: ${{ github.workspace }}/.build/SourcePackages
      DERIVED_DATA: ${{ github.workspace }}/.build/DerivedData
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Xcode version
        run: xcodebuild -version

      - uses: ./.github/actions/xcode-setup
        with:
          cache: ${{ matrix.cache }}
          scheme: ${{ matrix.resolve }}
          resolve-args: -clonedSourcePackagesDirPath ${{ env.PACKAGES_DIR }}
          metal: ${{ matrix.metal || 'true' }}

      - name: xcodebuild
        env:
          OS: ${{ matrix.os }}
          BUILDS: ${{ matrix.builds }}
          PLATFORM: ${{ matrix.platform }}
        run: .github/scripts/xcode-builds.sh "$PLATFORM"

  scripts:
    name: Script tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Run Python script tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Run shell script tests
        run: |
          for test in scripts/tests/test_*.sh; do
            [ -e "$test" ] || continue
            echo "== $test"
            sh "$test"
          done
